/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 2
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 200.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 
            scan_line: 6
            blind: 2.0

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    90.0
            det_range:     450.0
            extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ 0.04165, 0.02326, -0.0284 ]
            extrinsic_R: [ 1., 0., 0.,
                        0., 1., 0.,
                        0., 0., 1.]
            disable_fov_seg: false        # true disables FOV trimming -> ikd-Tree grows unbounded and can hang; the full global map is kept by pcl_global_map instead

        publish:
            path_en:  true
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: true       # true: publish the full undistorted scan; false publishes the 0.5 m downsampled one (looks very sparse)
            scan_bodyframe_pub_en: false # true: output the point cloud scans in IMU-body-frame
            map_en: false                # global map maintained by independent accumulator, do not use publish_map

        pcd_save:
            pcd_save_en: false           # true: accumulate + voxel-filter the whole global map every frame (O(N), gets slower over time)
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
            filter_size_pcd: 0.3         # voxel leaf size (m) for the global PCD accumulator
